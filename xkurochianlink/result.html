<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả tra cứu · xKuro Wallet</title>
  <meta name="description" content="Kết quả tra cứu số dư xKuro Wallet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #121216;
      --field: #17171d;
      --border: #2a2a33;
      --text: #f2f2f5;
      --muted: #9a9aa6;
      --accent: #8b7ff0;
      --accent-soft: rgba(139, 127, 240, 0.16);
      --up: #4cc38a;
      --down: #f0726d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 64px;
      padding: 0 32px;
      background: #000;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      white-space: nowrap;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover { color: var(--text); }
    .crumbs span[aria-current] { color: var(--text); }

    .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      padding: 4px 10px 4px 8px;
      border-radius: 999px;
      background: rgba(76, 195, 138, 0.12);
      color: var(--up);
      font-size: 12px;
      font-weight: 600;
    }

    .status svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.6; }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .lead { margin: 0; color: var(--muted); font-size: 15px; }

    .actions { display: flex; gap: 10px; flex-shrink: 0; }

    .btn {
      display: inline-grid;
      place-items: center;
      height: 42px;
      padding: 0 18px;
      border-radius: 10px;
      font: 600 14px "Inter", sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: #0b0b0d; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost { border: 1px solid var(--border); background: var(--field); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }

    .card {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .card-pad { padding: 24px; }

    .card-title {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Balance hero */
    .balance-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .balance {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    .balance small {
      margin-left: 8px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .balance-sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    .delta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .delta.up { background: rgba(76, 195, 138, 0.12); color: var(--up); }
    .delta.down { background: rgba(240, 114, 109, 0.12); color: var(--down); }

    .chart { margin-top: 20px; }
    .chart svg { display: block; width: 100%; height: 160px; }
    .chart-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Facts */
    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 0 0 16px 16px;
      overflow: hidden;
    }

    .fact { padding: 18px 24px; background: var(--panel); }
    .fact.wide { grid-column: 1 / -1; }
    .fact dt { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
    .fact dd { margin: 0; font-size: 15px; font-weight: 500; }

    .chain-chip { display: inline-flex; align-items: center; gap: 8px; }
    .chain-chip i {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-style: normal;
      font-weight: 700;
    }

    .addr-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      word-break: break-all;
    }

    .copy {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
      font: 500 12px "Inter", sans-serif;
      cursor: pointer;
    }

    .copy:hover { border-color: var(--accent); }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 14px 24px; text-align: left; white-space: nowrap; }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    td { border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: 0; }
    th:not(:first-child), td:not(:first-child) { text-align: right; }
    td.up { color: var(--up); }
    td.down { color: var(--down); }
    td.flat { color: var(--muted); }

    .note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty { padding: 80px 0; text-align: center; color: var(--muted); }
    .empty .btn { margin-top: 16px; }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      main { padding-top: 24px; }
      .head { flex-direction: column; align-items: stretch; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
      h1 { font-size: 26px; }
      .balance { font-size: 34px; }
      .card-pad { padding: 20px; }
      .facts { grid-template-columns: 1fr; }
      .fact { padding: 16px 20px; }
      th, td { padding: 12px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img src="../images/logo.jpg" alt="">
      xKuro Wallet
    </a>
  </header>

  <main id="root"></main>

  <script>
    const root = document.getElementById("root");

    function el(tag, props, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    // Stable pseudo-random number from a string, so sample data is the same for the same query
    function hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    const fmt = (n) => n.toLocaleString("vi-VN", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    const fmtPct = (n) => (n >= 0 ? "+" : "−") + Math.abs(n).toLocaleString("vi-VN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";

    function fmtDate(iso, daysBack) {
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      d.setDate(d.getDate() - daysBack);
      return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function sparkline(values) {
      const w = 600, h = 160, pad = 10;
      const min = Math.min(...values), max = Math.max(...values);
      const span = max - min || 1;
      const pts = values.map((v, i) => [
        pad + (i * (w - pad * 2)) / (values.length - 1),
        h - pad - ((v - min) / span) * (h - pad * 2),
      ]);
      const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + h + " L" + pts[0][0].toFixed(1) + " " + h + " Z";
      return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="Biểu đồ số dư mẫu">' +
        '<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#8b7ff0" stop-opacity="0.35"/><stop offset="1" stop-color="#8b7ff0" stop-opacity="0"/>' +
        "</linearGradient></defs>" +
        '<path d="' + area + '" fill="url(#fill)"/>' +
        '<path d="' + line + '" fill="none" stroke="#8b7ff0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        "</svg>";
    }

    let query = null;
    try {
      query = JSON.parse(sessionStorage.getItem("xkuro-query"));
    } catch (e) {
      query = null;
    }

    if (!query || !query.address) {
      root.append(
        el("div", { class: "empty" },
          el("p", { text: "Chưa có dữ liệu tra cứu." }),
          el("a", { class: "btn btn-primary", href: "balance.html", text: "Quay lại trình kiểm tra" })
        )
      );
    } else {
      const byBlock = query.filter === "block";
      const pointLabel = (i) => byBlock
        ? "#" + (Number(query.block) - i * 1000).toLocaleString("vi-VN")
        : fmtDate(query.date, i * 7);
      const filterValue = byBlock ? "#" + Number(query.block).toLocaleString("vi-VN") : fmtDate(query.date, 0);
      const filterText = (byBlock ? "Khối " : "Ngày ") + filterValue;

      // Sample series: index 0 is the queried point, higher index goes back in time
      const seed = [query.chain, query.address, query.token, query.block || query.date].join("|");
      const amount = (hash(seed) % 50000) / 1000 + 0.5;
      const series = [];
      for (let i = 0; i < 8; i++) {
        const noise = ((hash(seed + i) % 1000) / 1000 - 0.5) * 0.07 * amount;
        series.push(i === 0 ? amount : amount * (1 - i * 0.015) + noise);
      }
      const change = (i) => ((series[i] - series[i + 1]) / series[i + 1]) * 100;
      const headline = change(0);

      // Header
      const status = el("div", { class: "status" });
      status.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
      status.append("Đã điền đầy đủ thông tin");

      const head = el("div", { class: "head" },
        el("div", {},
          status,
          el("h1", { text: "Kết quả tra cứu" }),
          el("p", { class: "lead", text: "Số dư " + query.token + " trên " + query.chain + " · " + filterText })
        ),
        el("div", { class: "actions" },
          el("a", { class: "btn btn-ghost", href: "../index.html", text: "Về trang chủ" }),
          el("a", { class: "btn btn-primary", href: "balance.html", text: "Tra cứu mới" })
        )
      );

      // Balance card with chart
      const delta = el("span", { class: "delta " + (headline >= 0 ? "up" : "down"), text: fmtPct(headline) + " so với mốc trước" });
      const chart = el("div", { class: "chart" });
      chart.innerHTML = sparkline(series.slice().reverse());
      const axis = el("div", { class: "chart-axis" }, el("span", { text: pointLabel(7) }), el("span", { text: pointLabel(0) }));

      const balanceCard = el("section", { class: "card card-pad" },
        el("h2", { class: "card-title", text: "Số dư (dữ liệu mẫu)" }),
        el("div", { class: "balance-top" },
          el("div", {},
            el("div", { class: "balance" }, fmt(amount), el("small", { text: query.token })),
            el("p", { class: "balance-sub", text: "Tại " + filterText })
          ),
          delta
        ),
        chart,
        axis
      );

      // Query facts
      const copyBtn = el("button", { class: "copy", type: "button", text: "Sao chép" });
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(query.address);
          copyBtn.textContent = "Đã chép";
        } catch (e) {
          copyBtn.textContent = "Không chép được";
        }
        setTimeout(() => { copyBtn.textContent = "Sao chép"; }, 1500);
      });

      const chainChip = el("span", { class: "chain-chip" }, el("i", { text: query.chain.charAt(0).toUpperCase() }), query.chain);

      const factsCard = el("section", { class: "card" },
        el("h2", { class: "card-title card-pad", style: "margin:0;padding-bottom:0", text: "Thông tin tra cứu" }),
        el("dl", { class: "facts", style: "margin-top:16px" },
          el("div", { class: "fact" }, el("dt", { text: "Blockchain" }), el("dd", {}, chainChip)),
          el("div", { class: "fact" }, el("dt", { text: "Crypto" }), el("dd", { text: query.token })),
          el("div", { class: "fact wide" }, el("dt", { text: "Địa chỉ" }),
            el("dd", {}, el("div", { class: "addr-row" }, el("span", { class: "mono", text: query.address }), copyBtn))),
          el("div", { class: "fact wide" }, el("dt", { text: "Lọc theo" }), el("dd", { text: (byBlock ? "Khối · " : "Thời gian · ") + filterValue }))
        )
      );

      // History table
      const rows = [];
      for (let i = 0; i < 6; i++) {
        const c = change(i);
        const changeCell = el("td", { class: c >= 0 ? "up" : "down", text: fmtPct(c) });
        rows.push(el("tr", {},
          el("td", { text: pointLabel(i) }),
          el("td", { text: fmt(series[i]) + " " + query.token }),
          changeCell
        ));
      }

      const historyCard = el("section", { class: "card" },
        el("h2", { class: "card-title card-pad", style: "margin:0;padding-bottom:12px", text: "Lịch sử số dư (dữ liệu mẫu)" }),
        el("div", { class: "table-wrap" },
          el("table", {},
            el("thead", {}, el("tr", {},
              el("th", { text: byBlock ? "Khối" : "Mốc thời gian" }),
              el("th", { text: "Số dư" }),
              el("th", { text: "Thay đổi" })
            )),
            el("tbody", {}, ...rows)
          )
        )
      );

      root.append(
        el("nav", { class: "crumbs", "aria-label": "Điều hướng" },
          el("a", { href: "balance.html", text: "Trình kiểm tra số dư" }),
          el("span", { text: "/" }),
          el("span", { "aria-current": "page", text: "Kết quả" })
        ),
        head,
        balanceCard,
        factsCard,
        historyCard,
        el("p", { class: "note", text: "Số dư, biểu đồ và lịch sử trên trang này chỉ là dữ liệu minh họa, được tạo từ thông tin bạn nhập. Trang chưa kết nối với dữ liệu blockchain thật." })
      );
    }
  </script>
</body>
</html>
