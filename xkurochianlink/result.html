<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả tra cứu · xKuro Wallet</title>
  <meta name="description" content="Kết quả tra cứu số dư xKuro Wallet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #121216;
      --field: #17171d;
      --border: #2a2a33;
      --text: #f2f2f5;
      --muted: #9a9aa6;
      --accent: #8b7ff0;
      --accent-soft: rgba(139, 127, 240, 0.18);
      --ok: #4cc38a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 64px;
      padding: 0 32px;
      background: #000;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      white-space: nowrap;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 6px 12px 6px 8px;
      border-radius: 999px;
      background: rgba(76, 195, 138, 0.12);
      color: var(--ok);
      font-size: 13px;
      font-weight: 600;
    }

    .status svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .demo-note {
      margin: 0 0 24px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      margin-bottom: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    dl {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 14px 16px;
      margin: 0;
    }

    dt { color: var(--muted); font-size: 14px; }
    dd { margin: 0; font-size: 15px; font-weight: 500; word-break: break-all; }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }

    .copy {
      margin-left: 8px;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
      font: 500 12px "Inter", sans-serif;
      cursor: pointer;
    }

    .copy:hover { border-color: var(--accent); }

    .balance {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .balance small { font-size: 20px; color: var(--muted); font-weight: 600; margin-left: 6px; }
    .balance-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 0; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    td:last-child, th:last-child { text-align: right; }
    tr:last-child td { border-bottom: 0; }

    .actions { display: flex; gap: 12px; margin-top: 28px; }

    .btn {
      display: inline-grid;
      place-items: center;
      height: 48px;
      padding: 0 24px;
      border-radius: 12px;
      font: 600 15px "Inter", sans-serif;
      text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #0b0b0d; }
    .btn-ghost { border: 1px solid var(--border); background: var(--field); color: var(--text); }

    .empty { text-align: center; padding: 48px 0; color: var(--muted); }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      h1 { font-size: 26px; }
      dl { grid-template-columns: 1fr; gap: 4px; }
      dt { margin-top: 10px; }
      .balance { font-size: 32px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img src="../images/logo.jpg" alt="">
      xKuro Wallet
    </a>
  </header>

  <main id="root"></main>

  <script>
    const root = document.getElementById("root");

    function el(tag, props, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    // Deterministic pseudo-random number from a string, so the sample data is stable for the same query
    function hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    let query = null;
    try {
      query = JSON.parse(sessionStorage.getItem("xkuro-query"));
    } catch (e) {
      query = null;
    }

    if (!query || !query.address) {
      root.append(
        el("div", { class: "empty" },
          el("p", { text: "Chưa có dữ liệu tra cứu." }),
          el("a", { class: "btn btn-primary", href: "balance.html", text: "Quay lại trình kiểm tra" })
        )
      );
    } else {
      const byBlock = query.filter === "block";
      const filterText = byBlock
        ? "Khối #" + Number(query.block).toLocaleString("vi-VN")
        : "Thời gian: " + query.date;

      const seed = [query.chain, query.address, query.token, query.block || query.date].join("|");
      const amount = (hash(seed) % 50000) / 1000 + 0.5;
      const fmt = (n) => n.toLocaleString("vi-VN", { minimumFractionDigits: 4, maximumFractionDigits: 4 });

      const status = el("div", { class: "status" });
      status.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
      status.append("Đã điền đầy đủ thông tin");

      const copyBtn = el("button", { class: "copy", type: "button", text: "Sao chép" });
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(query.address);
          copyBtn.textContent = "Đã chép";
        } catch (e) {
          copyBtn.textContent = "Không chép được";
        }
        setTimeout(() => { copyBtn.textContent = "Sao chép"; }, 1500);
      });

      const info = el("section", { class: "card" },
        el("h2", { text: "Thông tin tra cứu" }),
        el("dl", {},
          el("dt", { text: "Blockchain" }), el("dd", { text: query.chain }),
          el("dt", { text: "Địa chỉ" }), el("dd", { class: "" }, el("span", { class: "mono", text: query.address }), copyBtn),
          el("dt", { text: "Crypto" }), el("dd", { text: query.token }),
          el("dt", { text: "Lọc theo" }), el("dd", { text: filterText })
        )
      );

      const balanceCard = el("section", { class: "card" },
        el("h2", { text: "Số dư (mẫu)" }),
        el("div", { class: "balance" }, fmt(amount), el("small", { text: query.token })),
        el("p", { class: "balance-sub", text: byBlock ? "Tại " + filterText : "Vào ngày " + query.date })
      );

      const rows = [];
      for (let i = 0; i < 5; i++) {
        const label = byBlock
          ? "#" + (Number(query.block) - i * 1000).toLocaleString("vi-VN")
          : "T-" + i * 7 + " ngày";
        const value = i === 0 ? amount : amount * (1 - i * 0.04) + (hash(seed + i) % 400) / 1000;
        rows.push(el("tr", {}, el("td", { text: label }), el("td", { text: fmt(value) + " " + query.token })));
      }

      const history = el("section", { class: "card" },
        el("h2", { text: "Lịch sử số dư (mẫu)" }),
        el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: byBlock ? "Khối" : "Mốc thời gian" }), el("th", { text: "Số dư" }))),
          el("tbody", {}, ...rows)
        )
      );

      root.append(
        status,
        el("h1", { text: "Kết quả tra cứu" }),
        el("p", { class: "lead", text: "Thông tin bạn đã nhập được ghi nhận bên dưới." }),
        el("p", { class: "demo-note", text: "Dữ liệu số dư và lịch sử trên trang này chỉ là minh họa, được tạo từ thông tin bạn nhập. Trang chưa kết nối với dữ liệu blockchain thật." }),
        info,
        balanceCard,
        history,
        el("div", { class: "actions" },
          el("a", { class: "btn btn-primary", href: "balance.html", text: "Tra cứu mới" }),
          el("a", { class: "btn btn-ghost", href: "../index.html", text: "Về trang chủ" })
        )
      );
    }
  </script>
</body>
</html>
