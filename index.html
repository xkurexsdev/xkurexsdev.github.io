<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xkurexsdev</title>
  <meta name="description" content="Trang profile của xkurexsdev">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0969da;
      --border: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --border: #30363d;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 40px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 4px;
    }

    .handle {
      color: var(--muted);
      margin: 0 0 16px;
    }

    .bio {
      color: var(--text);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover,
    .links a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">X</div>
    <h1>xkurexsdev</h1>
    <p class="handle">@xkurexsdev</p>
    <p class="bio">Chào mừng đến với trang profile của mình.</p>

    <nav class="links">
      <a href="https://github.com/xkurexsdev" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:xkurexsdev@gmail.com">Email</a>
    </nav>

    <footer>© 2026 xkurexsdev</footer>
  </main>
</body>
</html>
